AWSTemplateFormatVersion: "2010-09-09"
Description:  This template creates an autoscaling group for the Cloud Controller.

Parameters:
  ControllerSshKey:
    Description: Keypair name used for the Cloud Controller
    Type: AWS::EC2::KeyPair::KeyName
    ConstraintDescription: must be the name of an existing EC2 KeyPair.
  LatestAmiId:
    Description: Amazon AMI to use for the Bitrise Controller
    Type: AWS::EC2::Image::Id
  CustomBashScript:
    Description: Optional custom bash script to execute on the EC2 before bootstrap (leave empty to skip).
    Type: String
    Default: ""
  UseHostNetwork:
    Description: Use host network mode for Docker container (--net=host)
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

Resources:
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        IamInstanceProfile:
          Arn: !ImportValue bitriseInstanceProfileArn
        ImageId: !Ref LatestAmiId
        InstanceType: t2.small
        KeyName: !Ref ControllerSshKey
        Monitoring:
          Enabled: false
        SecurityGroupIds: [ !ImportValue bitriseInstanceSGGroupId ]
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: managed-by-bitrise
                Value: "true"
              - Key: Name
                Value: Bitrise Cloud Controller
          - ResourceType: volume
            Tags:
              - Key: managed-by-bitrise
                Value: "true"
              - Key: Name
                Value: Bitrise Cloud Controller
        UserData:
          Fn::Base64: 
            Fn::Sub: 
              - |
                #!/bin/bash
                
                mkdir -p /var/lib/bitrise
                cat > /var/lib/bitrise/custom-user-script.sh <<'CUSTOM_SCRIPT'
                ${CustomBashScript}
                CUSTOM_SCRIPT
                chmod +x /var/lib/bitrise/custom-user-script.sh
                /var/lib/bitrise/custom-user-script.sh >> /var/log/custom-user-script.log 2>&1
                sudo yum clean expire-cache
                sudo yum install jq -y
                sudo yum install docker -y
                sudo usermod -a -G docker ec2-user
                newgrp docker
                sudo systemctl enable docker.service
                sudo systemctl start docker.service
                docker pull public.ecr.aws/t4h1p2s4/bitrise-aws-cloud-controller:0.6.34
                export TOKEN=$(aws secretsmanager get-secret-value --secret-id ${BitriseControllerTokenSecretArn} --region ${Region} | jq  -r '.SecretString')
                export WORKSPACE_ID=$(aws secretsmanager get-secret-value --secret-id ${BitriseWorkspaceIDArn} --region ${Region} | jq  -r '.SecretString')                
                 # Build docker run command
                DOCKER_OPTS="-d -p 8080:8080 --restart=always --log-opt max-size=15m --log-opt max-file=5"
                
                # Add --net=host only if UseHostNetwork is true
                if [ "${UseHostNetwork}" == "true" ]; then
                  DOCKER_OPTS="$DOCKER_OPTS --net=host"
                fi
                
                docker run $DOCKER_OPTS public.ecr.aws/t4h1p2s4/bitrise-aws-cloud-controller:0.6.34 run \
                  --token  $TOKEN \
                  --workspace-id $WORKSPACE_ID \
                  --host cloud-controller-aws-internal.services.bitrise.dev:443 \
                  --cloudwatch-log-group-name ${ControllerLogGroupName} \
                  --cloudwatch-log-stream-name ${ControllerLogStreamName} \
                  --aws-region ${Region}
              - {
                BitriseControllerTokenSecretArn: !ImportValue BitriseControllerTokenSecretArn,
                BitriseWorkspaceIDArn: !ImportValue BitriseWorkplaceIDSecretArn,
                Region: !Ref AWS::Region,
                ControllerLogGroupName: !ImportValue BitriseControllerCloudWatchLogGroupName,
                ControllerLogStreamName: !ImportValue BitriseControllerCloudWatchLogStreamName,
                CustomBashScript: !Ref CustomBashScript,
                UseHostNetwork: !Ref UseHostNetwork
              }

      LaunchTemplateName: bitrise-aws-cloud-controller-launch-template
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: managed-by-bitrise
              Value: "true"
  HealthCheckLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      IpAddressType: ipv4
      Name: bitrise-controller-hc-lb
      Scheme: internal
      Subnets:
        - !ImportValue bitrisePrivateSubnet1Arn
        - !ImportValue bitrisePrivateSubnet2Arn
      SecurityGroups: 
        - !ImportValue bitriseLoadBalancerSecurityGroup
      Tags:
        - Key: managed-by-bitrise
          Value: "true"
      Type: application
  LBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref LoadBalancerTargetGroup
      LoadBalancerArn: !Ref HealthCheckLoadBalancer
      Port: 8080
      Protocol: HTTP
  LoadBalancerTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: true
      HealthCheckPath: /healthz
      HealthCheckPort: traffic-port
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 20
      Matcher: 
        HttpCode: "200"
      Name: bitrise-controller-hc-tg
      Port: 8080
      Protocol: HTTP
      Tags:
        - Key: managed-by-bitrise
          Value: "true"
      UnhealthyThresholdCount: 4
      VpcId: !ImportValue bitriseVpcArn
  AutoscalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: bitrise-aws-cloud-controller-asg
      DefaultInstanceWarmup: 60
      HealthCheckGracePeriod: 90
      HealthCheckType: ELB
      TargetGroupARNs:
        - !Ref LoadBalancerTargetGroup
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version:
          Fn::GetAtt:
            - LaunchTemplate
            - LatestVersionNumber
      MaxSize: "1"
      MinSize: "1"
      TerminationPolicies: [OldestInstance]
      VPCZoneIdentifier:
        - !ImportValue bitrisePrivateSubnet1Arn
        - !ImportValue bitrisePrivateSubnet2Arn
      Tags:
        - Key: managed-by-bitrise	
          Value: true
          PropagateAtLaunch: false
    UpdatePolicy:
      AutoScalingScheduledAction:
        IgnoreUnmodifiedGroupSizeProperties: true
Outputs: {}
